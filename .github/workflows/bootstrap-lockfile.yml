name: Bootstrap frontend lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --prefix frontend
      - name: Commit package lock
        run: |
          if git diff --quiet -- frontend/package-lock.json && git ls-files --error-unmatch frontend/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile is already present and unchanged."
            exit 0
          fi
          git config user.name "Hossein Rahimi"
          git config user.email "120735962+HoosseinRahimi@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: generate frontend lockfile"
          git push
