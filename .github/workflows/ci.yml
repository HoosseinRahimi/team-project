name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  conflict-marker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search for unresolved conflict markers
        run: ./scripts/check-conflict-markers.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint backend
        run: ruff check backend tests
      - name: Run backend tests
        run: python -m pytest -q
      - name: Fresh database initialization and data sync
        run: |
          python -m backend.database.init_db --seed
          python -m backend.database.sync_data
        env:
          DATABASE_PATH: /tmp/ci-app.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
